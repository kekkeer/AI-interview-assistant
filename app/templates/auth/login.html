{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center" style="margin-top:8vh">
  <div class="col-md-5">
    <div class="auth-card">
      <h3 class="mb-1 fw-bold">欢迎回来</h3>
      <p class="text-muted mb-4">登录后继续你的面试练习</p>

      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <form method="post" action="/auth/login">
        <div class="mb-3">
          <label class="form-label small fw-medium">用户名</label>
          <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-medium">密码</label>
          <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">登录</button>
      </form>

      <p class="mt-4 text-center text-muted small">
        没有账号？<a href="/auth/register" class="fw-medium">去注册</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
