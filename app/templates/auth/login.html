{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center" style="margin-top:6vh">
  <div class="col-md-5">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width:56px;height:56px;background:linear-gradient(135deg,#eef2ff,#ede9fe)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h4 class="fw-bold mb-1">欢迎回来</h4>
        <p class="text-muted small mb-0">登录后继续你的面试练习</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2 small mb-3">{{ error }}</div>
      {% endif %}

      <form method="post" action="/auth/login">
        <div class="mb-3">
          <label class="form-label small fw-medium">用户名</label>
          <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-medium">密码</label>
          <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background:linear-gradient(135deg,#4f46e5,#6366f1);border:none">登录</button>
      </form>

      <div class="text-center mt-4 pt-3" style="border-top:1px solid #f0f0f2">
        <p class="text-muted small mb-0">
          没有账号？<a href="/auth/register" class="fw-semibold text-decoration-none">去注册</a>
        </p>
      </div>
    </div>

    <p class="text-center text-muted small mt-3 opacity-50">AI 面试助手 · 模拟真实面试场景</p>
  </div>
</div>
{% endblock %}
