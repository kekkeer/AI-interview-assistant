<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ request.app.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">{{ request.app.title }}</a>
      <div class="d-flex">
        {% if user %}
        <span class="navbar-text me-3">{{ user.username }}</span>
        <a class="btn btn-outline-light btn-sm" href="/auth/logout">退出</a>
        {% else %}
        <a class="btn btn-outline-light btn-sm me-2" href="/auth/login">登录</a>
        <a class="btn btn-light btn-sm" href="/auth/register">注册</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
