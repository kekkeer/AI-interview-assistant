<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ request.app.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">{{ request.app.title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          {% block nav_items %}
          <li class="nav-item">
            <a class="nav-link" href="/">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/positions/">职位</a>
          </li>
          {% if user %}
          <li class="nav-item">
            <a class="nav-link" href="/interview/history">历史记录</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/dashboard/">数据看板</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/auth/profile">个人中心</a>
          </li>
          {% endif %}
          {% endblock %}
        </ul>
        <div class="d-flex">
          {% if user %}
          <span class="navbar-text me-3">{{ user.username }}</span>
          <a class="btn btn-outline-light btn-sm" href="/auth/logout">退出</a>
          {% else %}
          <a class="btn btn-outline-light btn-sm me-2" href="/auth/login">登录</a>
          <a class="btn btn-light btn-sm" href="/auth/register">注册</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</body>
</html>
