{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">数据看板</h2>

<div class="row g-4 mb-4">
  <div class="col-md-4">
    <div class="card text-center h-100">
      <div class="card-body">
        <h5 class="card-title text-muted">总面试次数</h5>
        <p class="display-4">{{ total }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center h-100">
      <div class="card-body">
        <h5 class="card-title text-muted">平均分</h5>
        <p class="display-4 {% if avg_score >= 60 %}text-success{% else %}text-danger{% endif %}">{{ avg_score }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center h-100">
      <div class="card-body">
        <h5 class="card-title text-muted">最高分</h5>
        <p class="display-4 text-primary">{{ max_score }}</p>
      </div>
    </div>
  </div>
</div>

{% if scores %}
<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">得分趋势</h5>
    <canvas id="scoreChart" height="100"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
new Chart(document.getElementById("scoreChart"), {
  type: "line",
  data: {
    labels: Array.from({length: {{ scores | length }}}, (_, i) => i + 1),
    datasets: [{
      label: "得分",
      data: {{ scores | safe }},
      borderColor: "#0d6efd",
      tension: 0.3
    }]
  },
  options: {
    spanGaps: true,
    scales: { y: { min: 0, max: 100 } },
    plugins: { legend: { display: false } }
  }
});
</script>
{% endif %}

<h5 class="mb-3">各职位面试次数</h5>
<table class="table">
  <thead class="table-light">
    <tr>
      <th>职位</th>
      <th>次数</th>
    </tr>
  </thead>
  <tbody>
    {% for title, count in distribution %}
    <tr>
      <td>{{ title }}</td>
      <td>{{ count }}</td>
    </tr>
    {% else %}
    <tr>
      <td colspan="2" class="text-muted text-center">暂无数据</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
