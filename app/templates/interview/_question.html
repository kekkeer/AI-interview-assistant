<div id="question-card">
  <form class="card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="badge bg-primary">第 {{ question.order }} / {{ total }} 题</span>
      </div>
      <div class="progress mb-3" style="height:4px">
        <div class="progress-bar" style="width:{{ question.order / total * 100 }}%;background:var(--primary)"></div>
      </div>
      <p class="card-text fs-5 mb-4">{{ question.content }}</p>

      <div class="mb-2">
        <textarea name="answer" class="form-control" rows="6" placeholder="请仔细阅读题目后作答...">{{ question.answer or "" }}</textarea>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        {% if question.order > 1 %}
        <button
          hx-post="/interview/{{ interview_id }}/answer"
          hx-include="closest form"
          hx-target="#question-card"
          hx-swap="outerHTML"
          hx-vals='{"question_id": {{ question.id }}, "direction": "prev"}'
          class="btn btn-outline-secondary">上一题</button>
        {% else %}
        <div></div>
        {% endif %}

        {% if question.order < total %}
        <button
          hx-post="/interview/{{ interview_id }}/answer"
          hx-include="closest form"
          hx-target="#question-card"
          hx-swap="outerHTML"
          hx-vals='{"question_id": {{ question.id }}, "direction": "next"}'
          class="btn btn-primary px-4 ms-auto">下一题</button>
        {% else %}
        <button
          hx-post="/interview/{{ interview_id }}/submit"
          hx-include="closest form"
          hx-vals='{"question_id": {{ question.id }}}'
          hx-indicator="#loading"
          hx-disabled-elt="this"
          class="btn btn-success px-4 ms-auto">提交全部答案</button>
        {% endif %}
      </div>
    </div>
  </form>
</div>
