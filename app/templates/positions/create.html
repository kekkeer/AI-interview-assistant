{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">创建自定义职位</h2>

    <p class="text-muted">填写职位名称和要求，AI 将根据你的描述生成面试题。</p>

    <form method="post" action="/positions/create" onsubmit="this.querySelector('button[type=submit]').disabled=true;this.querySelector('button[type=submit]').innerHTML='<span class=spinner-border spinner-border-sm me-2></span>创建中...'">
      <div class="mb-3">
        <label class="form-label">职位名称</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">职位描述 / 要求</label>
        <textarea name="description" class="form-control" rows="4" required placeholder="例如：Java基础扎实、熟悉Spring框架、有分布式系统经验"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">创建并开始面试</button>
    </form>

    <p class="mt-3 text-center">
      <a href="/positions/">返回职位列表</a>
    </p>
  </div>
</div>
{% endblock %}
