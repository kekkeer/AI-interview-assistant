{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">选择职位</h2>
  <a href="/positions/create" class="btn btn-outline-primary">+ 自定义职位</a>
</div>

{% if error %}
<div class="alert alert-danger alert-dismissible">{{ error }}</div>
{% endif %}

<div class="row g-4">
  {% for pos in positions %}
  <div class="col-md-6 col-lg-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ pos.title }}</h5>
        <p class="card-text text-muted small">{{ pos.description }}</p>
       <a href="/positions/{{ pos.id }}" class="btn btn-primary btn-sm">开始面试</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
