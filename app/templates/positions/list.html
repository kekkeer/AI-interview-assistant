{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">选择职位</h2>
  <a href="/positions/create" class="btn btn-outline-primary">+ 自定义职位</a>
</div>

{% if error %}
<div class="alert alert-danger alert-dismissible">{{ error }}</div>
{% endif %}

<div class="row g-4">
  {% for pos in positions %}
  <div class="col-md-6 col-lg-4">
    <div class="card h-100 border-0 shadow-sm">
      <div class="card-body py-3">
        <div class="d-flex justify-content-between align-items-start mb-1">
          <h5 class="card-title mb-0">{{ pos.title }}</h5>
          {% if pos.is_builtin %}<span class="badge bg-light text-muted" style="font-size:11px">内置</span>{% endif %}
        </div>
        <p class="card-text text-muted small mb-2">{{ pos.description }}</p>
        <a href="/positions/{{ pos.id }}" class="btn btn-primary btn-sm">开始面试</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
