{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2 class="mb-4">个人中心</h2>

    <div class="card">
      <div class="card-body">
        <dl class="row mb-0">
          <dt class="col-sm-3">用户名</dt>
          <dd class="col-sm-9">{{ user.username }}</dd>

          <dt class="col-sm-3">邮箱</dt>
          <dd class="col-sm-9">{{ user.email }}</dd>

          <dt class="col-sm-3">注册时间</dt>
          <dd class="col-sm-9">{{ user.created_at | dt }}</dd>
        </dl>
      </div>
    </div>
  </div>
</div>
{% endblock %}
