{% extends "base.html" %}

{% block content %}
<div class="mb-3">
  <h4 class="fw-bold mb-1">简历面试题</h4>
  <p class="text-muted small mb-0">基于 "{{ filename }}" 生成</p>
</div>

{% for q in questions %}
<div class="card border-0 shadow-sm rounded-4 mb-3">
  <div class="card-body py-3">
    <div class="d-flex align-items-start">
      <span class="badge bg-primary rounded-pill me-2 mt-1" style="min-width:28px">第{{ q.order }}题</span>
      <p class="mb-0">{{ q.content }}</p>
    </div>
  </div>
</div>
{% endfor %}

<div class="text-center mt-4">
  <a href="/resume/" class="btn btn-outline-primary px-4">重新上传</a>
</div>
{% endblock %}
